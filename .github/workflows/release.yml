name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布并已存在的 tag（如 v0.1.1）
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywin32 pillow python-pptx

      - name: 校验 tag 与 engine.py 版本一致
        shell: pwsh
        run: |
          $src = Get-Content src/engine.py -Raw
          if ($src -notmatch 'VERSION = "([^"]+)"') { throw "engine.py 缺 VERSION" }
          $v = $Matches[1]
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          if ("v$v" -ne $tag) { throw "tag($tag) 与 engine.py VERSION($v) 不一致" }
          # ppam 与版本无关（它是外壳），但仍要求仓库里有一份
          if (-not (Test-Path release/LToolbox.ppam)) { throw "缺少 release/LToolbox.ppam" }
          echo "VERSION=$v" >> $env:GITHUB_ENV

      - name: 构建 exe
        run: python tools/build_exe.py

      - name: 冒烟（冻结后能启动、版本与源码一致）
        run: python tools/smoke_exe.py dist/LToolbox.exe

      - name: 组装发布 zip
        run: |
          python tools/package_release.py
          Copy-Item "dist/LToolbox-$env:VERSION-win64.zip" "dist/LToolbox-win64.zip"
        shell: pwsh

      - name: 安装 Inno Setup
        run: choco install innosetup -y --no-progress

      - name: 编译安装包
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSION" "installer\LToolbox.iss"
          if (-not (Test-Path "dist\LToolbox-$env:VERSION-setup.exe")) { throw "安装包未生成" }

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: L的工具箱 ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/LToolbox-${{ env.VERSION }}-win64.zip
            dist/LToolbox-win64.zip
            dist/LToolbox-${{ env.VERSION }}-setup.exe
            dist/LToolbox-${{ env.VERSION }}.ppam
            dist/LToolbox.exe
